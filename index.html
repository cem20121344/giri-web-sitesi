<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş ve Kayıt Ekranı</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ffb347, #ffcc33);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 380px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .form-box {
            display: none;
            flex-direction: column;
        }

        .form-box.active {
            display: flex;
        }

        h2 {
            text-align: center;
            color: #fff;
            margin-bottom: 25px;
            font-size: 24px;
            font-weight: 600;
        }

        .input-box {
            position: relative;
            margin-bottom: 15px;
        }

        .input-box input {
            width: 100%;
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            outline: none;
            border-radius: 30px;
            font-size: 14px;
            color: #333;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, #ff8c00, #ffa500);
            border: none;
            border-radius: 30px;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }

        .btn:hover {
            background: linear-gradient(90deg, #e07b00, #ff8c00);
        }

        .switch-text {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #fff;
        }

        .switch-text span {
            font-weight: bold;
            cursor: pointer;
            text-decoration: underline;
            margin-left: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- GİRİŞ EKRANI -->
        <div id="login-form" class="form-box active">
            <h2>Login</h2>
            <form onsubmit="girisYap(event)">
                <div class="input-box">
                    <input type="email" id="loginEmail" placeholder="Email" required>
                </div>
                <div class="input-box">
                    <input type="password" id="loginPassword" placeholder="Password" required>
                </div>
                <button type="submit" class="btn">Login</button>
            </form>
            <div class="switch-text">
                Hesabın yok mu? <span onclick="toggleForm()">Sign Up</span>
            </div>
        </div>

        <!-- KAYIT OL EKRANI -->
        <div id="signup-form" class="form-box">
            <h2>Sign Up</h2>
            <form onsubmit="kayitOl(event)">
                <div class="input-box">
                    <input type="text" id="signupAd" placeholder="Adın" required>
                </div>
                <div class="input-box">
                    <input type="email" id="signupEmail" placeholder="Email" required>
                </div>
                <div class="input-box">
                    <input type="password" id="signupPassword" placeholder="Şifre" required>
                </div>
                <button type="submit" class="btn">Create Account</button>
            </form>
            <div class="switch-text">
                Zaten hesabın var mı? <span onclick="toggleForm()">Login</span>
            </div>
        </div>
    </div>

    <script>
        // Ekranlar arası geçiş yapma
        function toggleForm() {
            document.getElementById('login-form').classList.toggle('active');
            document.getElementById('signup-form').classList.toggle('active');
        }

        // KAYIT OLMA (Bilgileri tarayıcı hafızasına yazar)
        function kayitOl(event) {
            event.preventDefault();

            const ad = document.getElementById('signupAd').value;
            const email = document.getElementById('signupEmail').value;
            const sifre = document.getElementById('signupPassword').value;

            localStorage.setItem('kayitliEmail', email);
            localStorage.setItem('kayitliSifre', sifre);
            localStorage.setItem('kayitliAd', ad);

            alert("Kayıt başarılı! Şimdi giriş yapabilirsiniz.");
            toggleForm(); // Giriş ekranına döndürür
        }

        // GİRİŞ YAPMA (Doğruysa senin ana sayfana atar)
        function girisYap(event) {
            event.preventDefault();

            const girilenEmail = document.getElementById('loginEmail').value;
            const girilenSifre = document.getElementById('loginPassword').value;

            const kayitliEmail = localStorage.getItem('kayitliEmail');
            const kayitliSifre = localStorage.getItem('kayitliSifre');

            if (girilenEmail === kayitliEmail && girilenSifre === kayitliSifre) {
                alert("Giriş başarılı! Web sitenize yönlendiriliyorsunuz...");
                // Kendi oluşturduğumuz anasayfa dosyasına yönlendiriyoruz:
                window.location.href = "anasayfa.html";
            } else {
                alert("Hatalı email veya şifre! Lütfen önce kayıt olun.");
            }
        }
    </script>

</body>
</html>
